<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Reset your password</title>
  </head>
  <body style="font-family: Arial, sans-serif; line-height: 1.5; color: #222;">
    <h1>Hello, {{name}}!</h1>
    <p>You requested a password reset. Click the button below to set a new password.</p>
    <p>
      <a
        href="{{link}}"
        style="display: inline-block; padding: 10px 20px; background: #0d6efd; color: #fff; text-decoration: none; border-radius: 4px;"
      >
        Reset password
      </a>
    </p>
    <p>The link is valid for 15 minutes.</p>
    <p>If you did not request this, just ignore this email.</p>
  </body>
</html>
